# mediamtx config for SpoutRelay E2E tests
# Minimal config allowing RTSP publish/read on all paths

# RTSP server settings
rtspAddress: :8554

# No authentication (for testing)
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback

# Allow all paths
paths:
  all_others:
